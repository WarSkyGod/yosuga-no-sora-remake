name: Release OpenHarmony 5 (HAP)

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v0.1.0-test.1'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build OpenHarmony HAP and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository, submodules, and LFS content
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: false

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android/sdk/build-tools \
            /usr/local/lib/android/sdk/cmake \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/platforms \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/share/boost \
            /usr/share/dotnet
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y p7zip-full

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' ]]; then
            release_tag="$REF_NAME"
            if [[ "$release_tag" == *-* ]]; then
              is_prerelease=true
            else
              is_prerelease=false
            fi
          else
            release_tag="${INPUT_RELEASE_TAG//[[:space:]]/}"
            is_prerelease="$INPUT_PRERELEASE"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi

          version_name="${release_tag#v}"
          version_code="$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          {
            echo "tag=$release_tag"
            echo "prerelease=$is_prerelease"
            echo "version-name=$version_name"
            echo "version-code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Git LFS content
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull
          git lfs fsck

      - name: Generate and validate the content manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_content_manifest.py \
            --root data \
            --output data/content-manifest.json \
            --config content-packs.json \
            --cache "$RUNNER_TEMP/content-manifest-cache.json" \
            --full

      - name: Install the OpenHarmony 5.0 command line tools and SDK
        shell: bash
        env:
          OHOS_COMMAND_LINE_TOOLS_URL: ${{ vars.OHOS_COMMAND_LINE_TOOLS_URL }}
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/ohos-sdk"
          mkdir -p "$sdk_root"

          # Command line tools for API 12. This bundle already contains the
          # OpenHarmony SDK under command-line-tools/sdk/default/openharmony.
          # Override the repository variable OHOS_COMMAND_LINE_TOOLS_URL when
          # the mirror publishes a newer package:
          # https://gitee.com/openharmony/docs/blob/master/zh-cn/release-notes/OpenHarmony-v5.0.0-release.md
          cli_url="${OHOS_COMMAND_LINE_TOOLS_URL:-https://repo.huaweicloud.com/harmonyos/ohpm/5.0.3/commandline-tools-linux-x64-5.0.3.906.zip}"
          echo "Downloading command line tools: $cli_url"
          curl -fL --retry 3 --retry-delay 10 -o "$RUNNER_TEMP/commandline-tools.zip" "$cli_url"
          unzip -q -o "$RUNNER_TEMP/commandline-tools.zip" -d "$sdk_root/"
          if [[ ! -d "$sdk_root/command-line-tools" ]]; then
            echo 'The command line tools archive did not contain a command-line-tools directory.' >&2
            exit 1
          fi

          # The command line tools bundle ships the OpenHarmony SDK in the old
          # layout (command-line-tools/sdk/default/openharmony/<component>).
          # hvigor 5.8.x expects the new per-API layout instead:
          # <sdk_root>/<apiVersion>/<component>. Migrate the bundled SDK.
          bundled_sdk="$sdk_root/command-line-tools/sdk/default/openharmony"
          if [[ ! -d "$bundled_sdk/native" || ! -d "$bundled_sdk/ets" ]]; then
            echo 'The command line tools bundle did not include the OpenHarmony SDK.' >&2
            echo "Expected SDK components under $bundled_sdk" >&2
            exit 1
          fi

          uni_json="$(find "$bundled_sdk" -maxdepth 2 -name oh-uni-package.json -print -quit)"
          if [[ -z "$uni_json" ]]; then
            echo 'No oh-uni-package.json found in the bundled SDK.' >&2
            exit 1
          fi
          api_version="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('apiVersion',''))" "$uni_json")"
          if [[ -z "$api_version" ]]; then
            api_version="12"
          fi
          echo "Bundled OpenHarmony SDK API version: $api_version"

          mkdir -p "$sdk_root/$api_version"
          for component in ets js native previewer toolchains; do
            if [[ -d "$bundled_sdk/$component" ]]; then
              mv "$bundled_sdk/$component" "$sdk_root/$api_version/$component"
            fi
          done
          # Drop the now-empty legacy SDK shell so stale components are not
          # scanned again.
          rm -rf "$sdk_root/command-line-tools/sdk"

          # Free the downloaded archive before the multi-GiB build.
          rm -f "$RUNNER_TEMP/commandline-tools.zip"

          chmod +x "$sdk_root"/command-line-tools/bin/* 2>/dev/null || true
          if [[ ! -x "$sdk_root/command-line-tools/bin/hvigorw" ]]; then
            echo 'hvigorw was not found under command-line-tools/bin.' >&2
            exit 1
          fi
          if [[ ! -d "$sdk_root/$api_version/native" ]]; then
            echo "The OpenHarmony SDK native/ directory is missing under $sdk_root/$api_version." >&2
            exit 1
          fi

          echo "DEVECO_SDK_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "OHOS_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "OHOS_SDK_API=$api_version" >> "$GITHUB_ENV"
          ls "$sdk_root"
          ls "$sdk_root/$api_version"

      - name: Prepare the OpenHarmony project
        shell: bash
        run: |
          set -euo pipefail
          # Vendors and patches SDL2 for OpenHarmony and links data/ into the
          # rawfile packaging directory.
          python3 tools/setup_ohos_project.py

      - name: Build the release HAP
        id: build
        shell: bash
        env:
          OHOS_VERSION_NAME: ${{ steps.release.outputs.version-name }}
          OHOS_VERSION_CODE: ${{ steps.release.outputs.version-code }}
        run: |
          set -euo pipefail
          cli_bin="$DEVECO_SDK_HOME/command-line-tools/bin"
          export PATH="$cli_bin:$PATH"

          cd ohos-project

          # This hvigor locates the SDK through local.properties' sdk.dir or
          # the OHOS_BASE_SDK_HOME environment variable.
          {
            echo "sdk.dir=$DEVECO_SDK_HOME"
          } > local.properties
          export OHOS_BASE_SDK_HOME="$DEVECO_SDK_HOME"

          hvigorw --version
          ohpm --version || true
          # Inject the release version into the app manifest and align the
          # SDK API fields with the bundled OpenHarmony SDK.
          python3 - <<'PY'
          import os, re
          path = 'AppScope/app.json5'
          text = open(path, encoding='utf-8').read()
          text = re.sub(
              r'"(versionName)"\s*:\s*"[^"]*"',
              '"versionName": "' + os.environ['OHOS_VERSION_NAME'] + '"', text)
          text = re.sub(
              r'"(versionCode)"\s*:\s*\d+',
              '"versionCode": ' + os.environ['OHOS_VERSION_CODE'], text)
          open(path, 'w', encoding='utf-8').write(text)

          path = 'build-profile.json5'
          text = open(path, encoding='utf-8').read()
          api = os.environ.get('OHOS_SDK_API', '12')
          for field in ('compileSdkVersion', 'compatibleSdkVersion', 'targetSdkVersion'):
              text = re.sub(
                  r'("' + field + r'"\s*:\s*)[^,\n]+',
                  r'\g<1>' + api, text)
          open(path, 'w', encoding='utf-8').write(text)
          PY

          hvigorw assembleHap --mode module -p product=default \
            -p buildMode=release --no-daemon

          hap="$(find entry/build -name 'entry-default-*.hap' -print -quit)"
          if [[ -z "$hap" || ! -f "$hap" ]]; then
            echo 'No HAP was produced by the build.' >&2
            exit 1
          fi
          hap="$(realpath "$hap")"
          echo "hap=$hap" >> "$GITHUB_OUTPUT"
          ls -lh "$hap"

      - name: Sign the HAP when signing secrets are configured
        id: signing
        shell: bash
        env:
          HAP: ${{ steps.build.outputs.hap }}
          KEYSTORE_BASE64: ${{ secrets.OHOS_KEYSTORE_P12_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OHOS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OHOS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OHOS_KEY_PASSWORD }}
          APP_CERT_BASE64: ${{ secrets.OHOS_APP_CERT_BASE64 }}
          PROFILE_BASE64: ${{ secrets.OHOS_PROFILE_P7B_BASE64 }}
          OHOS_SIGN_TOOL_URL: ${{ vars.OHOS_SIGN_TOOL_URL }}
        run: |
          set -euo pipefail
          values=(
            "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS"
            "$KEY_PASSWORD" "$APP_CERT_BASE64" "$PROFILE_BASE64"
          )
          configured=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done

          if [[ "$configured" -eq 0 ]]; then
            echo 'No OpenHarmony signing secrets were provided; publishing the unsigned HAP.'
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$configured" -ne 6 ]]; then
            echo 'Configure all six OHOS signing secrets or none of them.' >&2
            exit 1
          fi

          keystore="$RUNNER_TEMP/ohos-keystore.p12"
          cert="$RUNNER_TEMP/ohos-app-cert.cer"
          profile="$RUNNER_TEMP/ohos-profile.p7b"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          printf '%s' "$APP_CERT_BASE64" | base64 --decode > "$cert"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile"
          chmod 600 "$keystore"

          # OpenHarmony's signing tool (verified mirror location).
          sign_tool="$RUNNER_TEMP/hap-sign-tool.jar"
          sign_tool_url="${OHOS_SIGN_TOOL_URL:-https://repo.huaweicloud.com/harmonyos/develop_tools/hapsigntoolv2.jar}"
          curl -fL --retry 3 --retry-delay 10 -o "$sign_tool" "$sign_tool_url"
          if [[ ! -f "$sign_tool" ]]; then
            echo "Signing tool not found: $sign_tool" >&2
            exit 1
          fi
          signed="${HAP%.hap}-signed.hap"
          java -jar "$sign_tool" sign-app \
            -keyAlias "$KEY_ALIAS" \
            -signAlg SHA256withECDSA \
            -mode localSign \
            -appCertFile "$cert" \
            -profileFile "$profile" \
            -inFile "$HAP" \
            -outFile "$signed" \
            -keystoreFile "$keystore" \
            -keyPwd "$KEY_PASSWORD" \
            -keystorePwd "$KEYSTORE_PASSWORD"

          echo "hap=$signed" >> "$GITHUB_OUTPUT"
          echo 'signed=true' >> "$GITHUB_OUTPUT"
          ls -lh "$signed"

      - name: Verify and package the HAP
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          HAP: ${{ steps.signing.outputs.hap || steps.build.outputs.hap }}
        run: |
          set -euo pipefail
          hap="$HAP"
          if [[ ! -f "$hap" ]]; then
            echo "HAP is missing: $hap" >&2
            exit 1
          fi

          # The package must contain the native libraries and the packaged
          # game data.
          unzip -t "$hap" >/dev/null
          mapfile -t contents < <(unzip -Z1 "$hap")
          content_list="$(printf '%s\n' "${contents[@]}")"
          for required in \
            'libs/arm64-v8a/libentry.so' \
            'libs/arm64-v8a/libkrkrsdl2.so' \
            'resources/rawfile/data/startup.tjs'; do
            if ! grep -Fxq "$required" <<<"$content_list"; then
              echo "The HAP is missing the required entry: $required" >&2
              exit 1
            fi
          done

          package_name="Yosuga-no-Sora-HD-Remake-OpenHarmony-arm64-$RELEASE_TAG.hap"
          asset_dir="$RUNNER_TEMP/release-assets"
          package_dir="$RUNNER_TEMP/ohos-package"
          mkdir -p "$asset_dir" "$package_dir"
          cp "$hap" "$package_dir/$package_name"

          # Remove intermediates before splitting the multi-GiB package.
          rm -rf ohos-project/entry/build ohos-project/.hvigor \
            ohos-project/entry/src/main/cpp/third_party

          archive="$asset_dir/$package_name.7z"
          (
            cd "$package_dir"
            7z a -t7z -mx=0 -mmt=on -v1900m "$archive" "$package_name"
          )

          shopt -s nullglob
          volumes=("$asset_dir/$package_name.7z."*)
          [[ "${#volumes[@]}" -gt 0 ]]
          7z t "${volumes[0]}"
          for volume in "${volumes[@]}"; do
            size=$(stat --printf='%s' "$volume")
            if ((size >= 2147483648)); then
              echo "Release asset exceeds GitHub's 2 GiB limit: $volume" >&2
              exit 1
            fi
          done

          (
            cd "$asset_dir"
            sha256sum "$package_name.7z".* > "$package_name-SHA256SUMS.txt"
          )

          cat > "$asset_dir/$package_name-BUILD-INFO.txt" <<EOF
          Yosuga no Sora: HD Remake
          Runtime: Kirikiri SDL2 for OpenHarmony 5.0 (API 12, ARM64)
          Release: $RELEASE_TAG
          Commit: $GITHUB_SHA
          Signing: ${SIGNED:-false}
          Native optimization: Release
          Known limitations: no SDL audio backend yet (silent), game data is
          extracted from rawfile into the app sandbox on first launch.
          EOF

          echo "asset-directory=$asset_dir" >> "$GITHUB_OUTPUT"
          ls -lh "$asset_dir"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          ASSET_DIRECTORY: ${{ steps.package.outputs.asset-directory }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=("$ASSET_DIRECTORY"/*)
          [[ "${#assets[@]}" -gt 0 ]]
          exists=false
          is_draft=false
          if json=$(gh release view "$RELEASE_TAG" --repo "$GH_REPOSITORY" \
            --json isDraft 2>/dev/null); then
            exists=true
            is_draft=$(python3 -c \
              'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())' \
              <<<"$json")
          else
            args=(release create "$RELEASE_TAG" --repo "$GH_REPOSITORY" --draft \
              --title "$RELEASE_TAG" --generate-notes)
            [[ "$EVENT_NAME" == 'push' ]] && args+=(--verify-tag) || args+=(--target "$COMMIT_SHA")
            [[ "$IS_PRERELEASE" == 'true' ]] && args+=(--prerelease)
            if ! gh "${args[@]}"; then
              for ((attempt = 1; attempt <= 12; attempt++)); do
                if json=$(gh release view "$RELEASE_TAG" --repo "$GH_REPOSITORY" \
                  --json isDraft 2>/dev/null); then
                  exists=true
                  is_draft=$(python3 -c \
                    'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())' \
                    <<<"$json")
                  break
                fi
                echo "Waiting for another workflow to create the release ($attempt/12)."
                sleep 5
              done
              [[ "$exists" == 'true' ]] || exit 1
            fi
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GH_REPOSITORY" --clobber
          if [[ "$exists" == 'false' || "$is_draft" == 'true' ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPOSITORY" --draft=false
          fi
